# Configuración estática (incluida en la imagen): el contenedor corre con
# filesystem de solo lectura. El enrutamiento de /api lo hace el Ingress.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Probe de Kubernetes (liveness/readiness)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Configuración de runtime del ambiente (ConfigMap): nunca en caché.
    location ^~ /runtime/ {
        expires -1;
        try_files $uri =404;
    }

    # Assets con hash en el nombre: cache agresivo.
    location ~* \.(?:js|css|woff2?|ico|svg|png|jpg|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta la resuelve el router de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
