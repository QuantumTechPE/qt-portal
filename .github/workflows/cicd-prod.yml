# CICD PROD · pase a producción, en el issue de pase:
#   /agendar AAAA-MM-DD HH:MM → aprobación de un admin → ejecución automática a
#   la hora agendada (lo dispara el agendador de qt-infra) → /ratificar
#   (release final vX.Y.Z).
name: CICD PROD

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [pase-ejecutar]

permissions:
  contents: read

jobs:
  pase:
    name: Pase
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'pase') &&
       (startsWith(github.event.comment.body, '/agendar') || startsWith(github.event.comment.body, '/ratificar')))
    # El turno se toma DENTRO del job (no a nivel workflow): un comentario dispara
    # CICD PROD, CICD CERT REV y CICD PROD REV, y los que no aplican se saltan sin
    # ocupar el turno ni cancelar al que sí corre.
    concurrency:
      group: pase-${{ github.event.issue.number || github.event.client_payload.issue }}
      cancel-in-progress: false
    uses: QuantumTechPE/qt-infra/.github/workflows/service-pase.yml@master
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: write
      attestations: read
