name: 🐞 Bug
description: Comportamiento incorrecto en algún ambiente.
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: Al asignarlo, el pipeline crea la rama `qt/<n>` (código **QT-<n>**) y lo pasa a **In Progress**.

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true

  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - local
        - staging
        - production
    validations:
      required: true

  - type: dropdown
    id: componente
    attributes:
      label: Componente
      multiple: true
      options:
        - Backend
        - Frontend
        - Infraestructura
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - P0 - Crítica
        - P1 - Alta
        - P2 - Media
        - P3 - Baja
      default: 1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / evidencia
      description: "Sin secretos ni datos personales."
      render: shell
    validations:
      required: false
