# =============================================================================
# qt-portal · valores COMUNES a dev, cert y prod
# (chart qt-infra/k8s/charts/qt-service; referencia completa en su values.yaml)
#
# Aquí va SOLO lo técnico; el plan de recursos de cada ambiente, en
# values-<ambiente>.yaml. Al promover, el pipeline lo compone en
# qt-gitops/apps/qt-portal/<ambiente>/values.yaml.
#
# La CONFIGURACIÓN de cada ambiente (config.json de la SPA) vive en el repo
# qt-config: dev/, cert/ y prod/<nombre-del-repo>-<ambiente>.yaml.
# =============================================================================

containerPort: 8080

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 2

# Ruta pública: <subdomain>.<dominio del clúster><path>
ingress:
  enabled: true
  subdomain: qt
  path: /

# Nginx no expone métricas Prometheus (las del Ingress las recoge Traefik)
metrics:
  enabled: false

# Observabilidad: un frontend no la necesita. Su salud la vigilan los probes
# (/healthz) de Kubernetes y Argo CD. Para verlo en Grafana: grafana: true.
observability:
  tracing: false   # Nginx no emite trazas OpenTelemetry
  grafana: false   # sin métricas ni logs en Grafana

# El config.json de qt-config (files:) se monta aquí → la SPA lo lee de /runtime/config.json
configFiles:
  mountPath: /usr/share/nginx/html/runtime

# Su configuración: qt-config <ambiente>/<nombre-del-repo>-<ambiente>.yaml
# (dev ← rama pre-develop, cert ← develop, prod ← master).
# Lo que ESTA versión necesita encontrar en qt-config de cada ambiente. DEV, el
# congelamiento y el pase lo verifican ANTES de desplegar.
requiredConfig:
  env: []
  files: [config.json]
  secrets: []
